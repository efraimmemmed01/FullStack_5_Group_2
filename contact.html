<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Page</title>
    <link rel="stylesheet" href="./assets/css/contact.css">
    <link rel="stylesheet" href="./assets/css/page.css">
</head>
<body>

    <header class="top-header">
        <h1>CONTACT US</h1>
        <div class="header-buttons">
            <a href="#" class="btn btn-white">CALL NOW</a>
            <a href="#" class="btn btn-orange">ORDER NOW</a>
        </div>
    </header>

    <main class="contact-section">
        <div class="container">
            <div class="content-wrapper">
                <div class="technician-info">
                    <h2>How can <br> we help you?</h2>
                    <img src="assets/image/usta.png" alt="Technician" class="tech-img">
                </div>
                
                <div class="contact-form">
                    <form>
                        <input type="text" placeholder="Full name">
                        <input type="email" placeholder="Email">
                        <textarea placeholder="Write your message" rows="5"></textarea>
                        <button type="submit" class="send-btn">SEND</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bottom-footer">
        <div class="footer-content">
            <p>Is something wrong? <strong>We'll fix it!</strong></p>
            <p class="phone-number">+994 51331 86 85</p>
            <a href="#" class="order-btn-footer">ORDER NOW</a>
        </div>
    </footer>

</body>
</html>
